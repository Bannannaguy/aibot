<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kael - Voice Robot Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen flex flex-col overflow-hidden">
    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-emerald-500/20 border border-emerald-500/50 flex items-center justify-center text-emerald-400 text-xl animate-pulse">
                <i class="fa-solid fa-robot"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-wider text-emerald-400">KAEL <span class="text-xs px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-300 border border-emerald-500/30">0.2.6.3.1-PRIME_beta Online</span></h1>
                <p class="text-xs text-slate-400">Talking Companion • Half-Assembled Chassis & Exposed Wires</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="toggleMemories()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg text-xs font-medium text-emerald-300 transition flex items-center space-x-2">
                <i class="fa-solid fa-brain"></i>
                <span>Memory Core</span>
                <span id="mem-count" class="bg-emerald-500/20 text-emerald-400 px-1.5 py-0.5 rounded-full text-[10px]">0</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="flex flex-1 overflow-hidden relative">
        <!-- Chat Area -->
        <div class="flex-1 flex flex-col justify-between p-4 max-w-4xl mx-auto w-full">
            <!-- Messages Container -->
            <div id="chat-messages" class="flex-1 overflow-y-auto space-y-4 pr-2 mb-4">
                <div class="flex items-start space-x-3">
                    <div class="w-8 h-8 rounded-full bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 text-sm shrink-0">
                        <i class="fa-solid fa-robot"></i>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 p-3.5 rounded-2xl rounded-tl-none max-w-[80%] text-sm text-slate-200 shadow-md">
                        Kael tactical core online. Chassis scarred, but systems operational. Standing by, commander.
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-2 flex items-center space-x-2 shadow-xl">
                <input type="text" id="user-input" placeholder="Say something to KAEL..." class="flex-1 bg-transparent border-none outline-none px-3 text-sm text-slate-100 placeholder-slate-500" onkeydown="handleKeyPress(event)">
                <button onclick="sendMessage()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 px-4 py-2.5 rounded-xl font-semibold text-sm transition flex items-center space-x-2 shadow-lg shadow-emerald-500/20">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span class="hidden sm:inline">Send</span>
                </button>
            </div>
        </div>

        <!-- Memory Drawer -->
        <div id="memory-drawer" class="absolute right-0 top-0 bottom-0 w-80 bg-slate-900 border-l border-slate-800 p-4 flex flex-col transform translate-x-full transition-transform duration-300 z-50 shadow-2xl">
            <div class="flex justify-between items-center pb-3 border-b border-slate-800 mb-4">
                <h2 class="font-bold text-emerald-400 text-sm flex items-center space-x-2">
                    <i class="fa-solid fa-brain"></i>
                    <span>Categorized Memory Core</span>
                </h2>
                <button onclick="toggleMemories()" class="text-slate-400 hover:text-slate-200 text-sm">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div id="memory-list" class="flex-1 overflow-y-auto space-y-4 text-xs pr-1">
                <!-- Populated dynamically -->
            </div>

            <div class="pt-3 border-t border-slate-800 mt-2 flex space-x-2">
                <button onclick="resetMemories()" class="w-full py-2 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-lg font-medium transition">
                    <i class="fa-solid fa-triangle-exclamation mr-1"></i> Reset Memory
                </button>
            </div>
        </div>
    </div>

    <script>
        let memoriesOpen = false;

        async function fetchMemories() {
            try {
                const res = await fetch('/api/memories');
                const data = await res.json();
                document.getElementById('mem-count').innerText = data.count || 0;
                
                const listEl = document.getElementById('memory-list');
                listEl.innerHTML = '';

                for (const [cat, items] of Object.entries(data.memories)) {
                    if (items.length === 0) continue;
                    const catDiv = document.createElement('div');
                    catDiv.className = 'bg-slate-950/60 border border-slate-800/80 rounded-xl p-3';
                    catDiv.innerHTML = `<h3 class="font-semibold text-emerald-300 uppercase tracking-wider text-[11px] mb-2 border-b border-slate-800 pb-1 flex justify-between"><span>${cat}</span><span class="text-slate-500">${items.length}</span></h3>`;
                    
                    const ul = document.createElement('ul');
                    ul.className = 'space-y-1.5';
                    items.forEach(item => {
                        const li = document.createElement('li');
                        li.className = 'text-slate-300 bg-slate-900/80 px-2.5 py-1.5 rounded border border-slate-800';
                        li.innerText = item;
                        ul.appendChild(li);
                    });
                    catDiv.appendChild(ul);
                    listEl.appendChild(catDiv);
                }

                if (listEl.innerHTML === '') {
                    listEl.innerHTML = '<div class="text-center text-slate-500 py-8">No memories recorded yet. Chat with KAEL to store facts!</div>';
                }
            } catch (e) {
                console.error('Failed to load memories:', e);
            }
        }

        function toggleMemories() {
            memoriesOpen = !memoriesOpen;
            const drawer = document.getElementById('memory-drawer');
            if (memoriesOpen) {
                drawer.classList.remove('translate-x-full');
                fetchMemories();
            } else {
                drawer.classList.add('translate-x-full');
            }
        }

        async function resetMemories() {
            if (!confirm("Are you sure you want to wipe Kael's memory core?")) return;
            await sendMessage("clear memory");
            toggleMemories();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            const inputEl = document.getElementById('user-input');
            const msg = inputEl.value.trim();
            if (!msg) return;

            inputEl.value = '';
            appendMessage(msg, 'user');

            const typingId = showTypingIndicator();

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg })
                });
                const data = await res.json();
                
                removeTypingIndicator(typingId);
                appendMessage(data.response, 'Kael');
                fetchMemories();
            } catch (e) {
                removeTypingIndicator(typingId);
                appendMessage("My wires are sparking! Connection error.", 'Kael');
            }
        }

        function appendMessage(text, sender) {
            const container = document.getElementById('chat-messages');
            const isUser = sender === 'user';
            
            const wrapper = document.createElement('div');
            wrapper.className = `flex items-start space-x-3 ${isUser ? 'flex-rore-reverse space-x-reverse' : ''}`;
            if (isUser) wrapper.className = "flex items-start space-x-3 flex-row-reverse space-x-reverse";

            const avatar = document.createElement('div');
            avatar.className = `w-8 h-8 rounded-full flex items-center justify-center text-sm shrink-0 ${isUser ? 'bg-indigo-500/20 border border-indigo-500/40 text-indigo-400' : 'bg-emerald-500/20 border border-emerald-500/40 text-emerald-400'}`;
            avatar.innerHTML = `<i class="fa-solid ${isUser ? 'fa-user' : 'fa-robot'}"></i>`;

            const bubble = document.createElement('div');
            bubble.className = `p-3.5 rounded-2xl max-w-[80%] text-sm shadow-md ${isUser ? 'bg-indigo-600 text-white rounded-tr-none' : 'bg-slate-900 border border-slate-800 text-slate-200 rounded-tl-none'}`;
            bubble.style.whiteSpace = 'pre-wrap';
            bubble.innerText = text;

            wrapper.appendChild(avatar);
            wrapper.appendChild(bubble);
            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;
        }

        function showTypingIndicator() {
            const container = document.getElementById('chat-messages');
            const id = 'typing-' + Date.now();
            
            const wrapper = document.createElement('div');
            wrapper.id = id;
            wrapper.className = 'flex items-start space-x-3';

            wrapper.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 text-sm shrink-0">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-3.5 rounded-2xl rounded-tl-none text-sm text-slate-400 shadow-md flex items-center space-x-1.5">
                    <span class="w-2 h-2 bg-emerald-400 rounded-full animate-bounce"></span>
                    <span class="w-2 h-2 bg-emerald-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></span>
                    <span class="w-2 h-2 bg-emerald-400 rounded-full animate-bounce" style="animation-delay: 0.4s"></span>
                </div>
            `;
            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;
            return id;
        }

        function removeTypingIndicator(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        fetchMemories();
    </script>
</body>
</html>
